
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON AIR HOCKEY</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:15px;
  display:flex;justify-content:center;align-items:center;
  font-family:Arial,sans-serif;color:white;
  background:radial-gradient(ellipse at top,#182c50,#070b18 70%);
}
.app{width:100%;max-width:900px;text-align:center}
h1{font-size:clamp(27px,5vw,43px);letter-spacing:4px;margin:5px}
h1 span{color:#00f5ff;text-shadow:0 0 20px #00f5ff88}
.sub{color:#9daecb;font-size:11px;letter-spacing:3px;margin:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin:22px 0 12px}
.player{flex:1;padding:13px 5px;background:#101c31;
  border:1px solid #00dfff55;border-radius:14px}
.player.p2{border-color:#ff4dba66}
.label{font-size:11px;letter-spacing:2px;color:#aabbd6}
.score{font-size:35px;font-weight:900;color:#00f5ff;margin-top:4px}
.p2 .score{color:#ff55bb}
.center{font-size:13px;font-weight:bold;color:#ffe477;padding:8px}
.arena{
  position:relative;width:100%;overflow:hidden;
  border:2px solid #00eaff;border-radius:18px;
  box-shadow:0 0 25px #00dfff33,inset 0 0 30px #00dfff0c;
  background:#071a29;
}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{display:flex;justify-content:center;gap:12px;
  flex-wrap:wrap;margin:17px 0}
button{padding:12px 19px;border-radius:10px;cursor:pointer;
  border:1px solid #00dfff66;background:#12253d;
  color:#eafcff;font-weight:bold;transition:.2s}
button:hover{transform:translateY(-2px);background:#1d3c5c}
.primary{background:#00dbea;color:#04101a;border:0}
.help{color:#a8b8d1;font-size:13px;line-height:1.8}
#status{color:#00f5ff;font-weight:bold;min-height:22px}
kbd{padding:3px 6px;border:1px solid #52627c;border-radius:5px;
  background:#172238;color:#fff}
@media(max-width:500px){
  body{padding:8px}
  .label{font-size:9px;letter-spacing:1px}
  .score{font-size:28px}
  .topbar{gap:5px}
  button{padding:11px 13px}
}
</style>
</head>
<body>

<div class="app">
  <h1>NEON <span>AIR HOCKEY</span></h1>
  <div class="sub">⚡ TWO PLAYERS · ONE ARENA ⚡</div>

  <div class="topbar">
    <div class="player">
      <div class="label">🔵 PLAYER 1</div>
      <div class="score" id="s1">0</div>
    </div>
    <div class="center">FIRST TO 5<br>🏆</div>
    <div class="player p2">
      <div class="label">🔴 PLAYER 2</div>
      <div class="score" id="s2">0</div>
    </div>
  </div>

  <div class="arena">
    <canvas id="game" width="800" height="500"></canvas>
  </div>

  <p id="status">PRESS START TO PLAY</p>

  <div class="controls">
    <button class="primary" id="start">▶ START GAME</button>
    <button id="sound">🔊 SOUND ON</button>
    <button id="reset">↻ RESTART</button>
  </div>

  <div class="help">
    <b>PLAYER 1:</b> Move with <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>
    <b>PLAYER 2:</b> Move with <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd><br>
    On mobile, drag your paddle with your finger.
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=800,H=500;
const goalH=155,goalTop=(H-goalH)/2;
let score1=0,score2=0,running=false,finished=false;
let soundOn=true,audio=null,last=0,goalPause=0;
let keys={};
let particles=[];
let message="READY?";
let touchTargets=[null,null];

const p1={x:200,y:250,r:27,vx:0,vy:0,color:"#00f5ff"};
const p2={x:600,y:250,r:27,vx:0,vy:0,color:"#ff4db8"};
const puck={x:400,y:250,r:13,vx:0,vy:0};
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

function sound(freq=400,duration=.1){
 if(!soundOn)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  let o=audio.createOscillator(),g=audio.createGain();
  o.connect(g);g.connect(audio.destination);
  o.frequency.value=freq;g.gain.value=.06;
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

function updateScores(){
 document.getElementById("s1").textContent=score1;
 document.getElementById("s2").textContent=score2;
}
function setStatus(t){document.getElementById("status").textContent=t}

function resetPositions(direction=1){
 p1.x=200;p1.y=250;p1.vx=p1.vy=0;
 p2.x=600;p2.y=250;p2.vx=p2.vy=0;
 puck.x=400;puck.y=250;
 puck.vx=direction*300;puck.vy=(Math.random()-.5)*180;
 particles=[];
}

function startGame(){
 if(finished){resetGame();return}
 running=true;
 setStatus("GAME ON! SCORE 5 GOALS TO WIN");
 document.getElementById("start").textContent="⏸ PAUSE";
 last=performance.now();
}
function resetGame(){
 score1=score2=0;running=false;finished=false;goalPause=0;
 message="READY?";
 resetPositions(Math.random()<.5?-1:1);
 updateScores();draw();
 setStatus("PRESS START TO PLAY");
 document.getElementById("start").textContent="▶ START GAME";
}

document.getElementById("start").onclick=()=>{
 if(finished){resetGame();startGame();return}
 if(running){
  running=false;
  setStatus("PAUSED — PRESS RESUME");
  document.getElementById("start").textContent="▶ RESUME";
 }else startGame();
};
document.getElementById("reset").onclick=resetGame;
document.getElementById("sound").onclick=()=>{
 soundOn=!soundOn;
 document.getElementById("sound").textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
 sound(500);
};

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function pointerPos(e){
 const rect=canvas.getBoundingClientRect();
 return {
  x:(e.clientX-rect.left)*W/rect.width,
  y:(e.clientY-rect.top)*H/rect.height
 };
}
canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 canvas.setPointerCapture(e.pointerId);
 const pos=pointerPos(e);
 const index=pos.x<W/2?0:1;
 touchTargets[index]=pos;
});
canvas.addEventListener("pointermove",e=>{
 if(!e.buttons&&!e.pressure)return;
 const pos=pointerPos(e);
 const rect=canvas.getBoundingClientRect();
 if(pos.x<0||pos.x>W||pos.y<0||pos.y>H)return;
 if(touchTargets[0]&&pos.x<W/2)touchTargets[0]=pos;
 else if(touchTargets[1]&&pos.x>=W/2)touchTargets[1]=pos;
});
function endPointer(e){
 touchTargets=[null,null];
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);

function movePaddle(p,dx,dy,dt,minX,maxX,target){
 if(target){
  const tx=clamp(target.x,minX+p.r,maxX-p.r);
  const ty=clamp(target.y,p.r,H-p.r);
  p.vx=(tx-p.x)*12;p.vy=(ty-p.y)*12;
  p.x+=(tx-p.x)*Math.min(1,dt*15);
  p.y+=(ty-p.y)*Math.min(1,dt*15);
 }else{
  const speed=390;
  p.vx=dx*speed;p.vy=dy*speed;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
 }
 p.x=clamp(p.x,minX+p.r,maxX-p.r);
 p.y=clamp(p.y,p.r,H-p.r);
}

function burst(x,y,color){
 for(let i=0;i<24;i++){
  const a=Math.random()*Math.PI*2,s=60+Math.random()*230;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
    life:.7+Math.random()*.6,color});
 }
}
function goal(player){
 if(player===1)score1++;else score2++;
 updateScores();sound(700,.3);
 burst(puck.x,puck.y,player===1?p1.color:p2.color);
 message="PLAYER "+player+" SCORES!";
 setStatus(message);
 running=false;goalPause=1;
 if(score1>=5||score2>=5){
  finished=true;
  message="PLAYER "+(score1>=5?1:2)+" WINS!";
  setStatus("🏆 "+message+" PRESS RESTART TO PLAY AGAIN");
  document.getElementById("start").textContent="▶ PLAY AGAIN";
 }
 resetPositions(player===1?-1:1);
}

function collidePaddle(p){
 let dx=puck.x-p.x,dy=puck.y-p.y;
 let dist=Math.hypot(dx,dy),min=puck.r+p.r;
 if(dist<min){
  if(dist===0){dx=1;dist=1}
  let nx=dx/dist,ny=dy/dist;
  puck.x=p.x+nx*(min+1);
  puck.y=p.y+ny*(min+1);
  let relx=puck.vx-p.vx*.65,rely=puck.vy-p.vy*.65;
  let dot=relx*nx+rely*ny;
  if(dot<0){
   puck.vx-=2*dot*nx;
   puck.vy-=2*dot*ny;
  }
  puck.vx+=p.vx*.25;puck.vy+=p.vy*.25;
  const sp=Math.hypot(puck.vx,puck.vy);
  if(sp>780){puck.vx*=780/sp;puck.vy*=780/sp}
  sound(250+Math.random()*250,.06);
  burst(puck.x,puck.y,p.color);
 }
}

function update(dt){
 if(!running)return;

 if(goalPause>0){goalPause-=dt;return}

 movePaddle(p1,
  (keys.d?1:0)-(keys.a?1:0),
  (keys.s?1:0)-(keys.w?1:0),dt,0,W/2,null);

 movePaddle(p2,
  (keys.arrowright?1:0)-(keys.arrowleft?1:0),
  (keys.arrowdown?1:0)-(keys.arrowup?1:0),dt,W/2,W,null);

 // Keep both players' paddles in their own half.
 puck.x+=puck.vx*dt;
 puck.y+=puck.vy*dt;

 if(puck.y-puck.r<0){puck.y=puck.r;puck.vy=Math.abs(puck.vy);sound(180,.04)}
 if(puck.y+puck.r>H){puck.y=H-puck.r;puck.vy=-Math.abs(puck.vy);sound(180,.04)}

 if(puck.x-puck.r<0){
  if(puck.y>goalTop&&puck.y<goalTop+goalH)goal(2);
  else{puck.x=puck.r;puck.vx=Math.abs(puck.vx);sound(180,.04)}
 }
 if(puck.x+puck.r>W){
  if(puck.y>goalTop&&puck.y<goalTop+goalH)goal(1);
  else{puck.x=W-puck.r;puck.vx=-Math.abs(puck.vx);sound(180,.04)}
 }

 collidePaddle(p1);collidePaddle(p2);

 // Air resistance
 puck.vx*=Math.pow(.998,dt*60);
 puck.vy*=Math.pow(.998,dt*60);

 for(let i=particles.length-1;i>=0;i--){
  let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;
  q.vx*=.98;q.vy*=.98;q.life-=dt;
  if(q.life<=0)particles.splice(i,1);
 }
}

function circle(x,y,r,color,glow){
 ctx.save();ctx.shadowBlur=glow;ctx.shadowColor=color;
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.strokeStyle="#ffffffaa";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(x,y,r*.68,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 // Ice rink
 const grad=ctx.createLinearGradient(0,0,W,H);
 grad.addColorStop(0,"#09283b");grad.addColorStop(.5,"#071827");grad.addColorStop(1,"#10233c");
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 // Rink markings
 ctx.strokeStyle="#7deaff44";ctx.lineWidth=2;
 ctx.strokeRect(12,12,W-24,H-24);
 ctx.beginPath();ctx.moveTo(W/2,12);ctx.lineTo(W/2,H-12);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,H/2,65,0,Math.PI*2);ctx.stroke();

 // Goal openings
 ctx.fillStyle="#00eaff22";ctx.fillRect(0,goalTop,12,goalH);
 ctx.fillStyle="#ff4db822";ctx.fillRect(W-12,goalTop,12,goalH);
 ctx.strokeStyle="#00f5ff";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(5,goalTop);ctx.lineTo(5,goalTop+goalH);ctx.stroke();
 ctx.strokeStyle="#ff4db8";
 ctx.beginPath();ctx.moveTo(W-5,goalTop);ctx.lineTo(W-5,goalTop+goalH);ctx.stroke();

 // Center spots
 circle(W/2,H/2,5,"#b9f7ff",10);

 // Puck trail
 for(let i=5;i>=1;i--){
  ctx.globalAlpha=.045*i;
  circle(puck.x-puck.vx*i*.009,puck.y-puck.vy*i*.009,puck.r*(.5+i*.1),"#ffffff",0);
 }
 ctx.globalAlpha=1;

 circle(p1.x,p1.y,p1.r,p1.color,25);
 circle(p2.x,p2.y,p2.r,p2.color,25);
 circle(puck.x,puck.y,puck.r,"#ffffff",20);

 particles.forEach(q=>{
  ctx.globalAlpha=Math.max(0,q.life);
  ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,4,4);
 });
 ctx.globalAlpha=1;

 if(!running&&!finished){
  ctx.fillStyle="#000b";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#ffffff";ctx.textAlign="center";
  ctx.font="bold 30px Arial";ctx.fillText("AIR HOCKEY",W/2,H/2-8);
  ctx.fillStyle="#00f5ff";ctx.font="16px Arial";
  ctx.fillText("PRESS START TO PLAY",W/2,H/2+27);
 }
}

function loop(now){
 const dt=Math.min((now-last)/1000||0,.025);
 last=now;
 update(dt);draw();
 requestAnimationFrame(loop);
}
resetPositions();
draw();
requestAnimationFrame(t=>{last=t;loop(t)});
</script>
</body>
</html>
